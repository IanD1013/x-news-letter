<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A quiet reader for the X accounts you follow" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="feed.xml" />
    <link rel="alternate" type="application/atom+xml" title="Atom" href="atom.xml" />
    <link rel="alternate" type="application/feed+json" title="JSON Feed" href="feed.json" />
    <title>X Reader</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var prefs = JSON.parse(localStorage.getItem("xnl.prefs") || "{}");
        var dark =
          prefs.theme === "dark" ||
          (prefs.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
